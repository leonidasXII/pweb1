<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Utama</title>
    <style>
        /* 1. Hapus margin & padding bawaan browser agar tidak ada celah di pinggir */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #b9e8fc; /* Warna latar belakang seperti di gambar kamu */
        }

        /* 2. Atur gambar agar pas menempel kiri-kanan dan tingginya 25% dari layar */
        .gambar-pantai {
            width: 100vw;       
            height: 25vh;      
            object-fit: cover;  
            display: block;     
            border-radius: 0px;   
        }
    </style>
</head>
<body>
    <!-- Ganti gambar.jpg dengan nama file/URL gambar kamu -->
    <img src="/image/pantai.jpg" alt="pantai" class="gambar-pantai">
    <h1>Selamat Datang di Halaman Utama</h1>
</body>
</html>
