<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javaa</title>
</head>
<body>
    <h1 id="judul">Judul Awal</h1>
    <button id="ubah" type="button">Ubah Judul</button>
    <p id="info">Tombol Beljum di klik.</p>

    <script>
        const judul = document.getElementById("judul");
        const tombol = document.getElementById("ubah");
        const info = document.getElementById("info");

        tombol.addEventListener("click", function (){
            judul.textContent = "hihuu";
            info.textContent = "Judul Tab: " + document.title;
            console.log(window.location.protocol)
        })
    </script>
</body>
</html>
